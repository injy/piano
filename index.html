<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>电子钢琴</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#333333">
  <link rel="shortcut icon" type="image/favicon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/app.styl">
  <script type="module" src="/src/app.js"></script>
  <style>
    body {
      visibility: hidden;
    }
  </style>
</head>
<body>
  
  <!-- 音色选择器 -->
  <div class="sound-selector">
    <button class="active" data-sound="pure">纯静</button>
    <button data-sound="soft">柔和</button>
    <button data-sound="electric">电子</button>
    <button data-sound="orchestra">管弦</button>
  </div>
  
  <!-- 横屏按钮 -->
  <button class="landscape-btn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 21H2V3h5v1.5h13V3H21v18h-5v-1.5H7.5z"/></svg>
    <span class="btn-text">横屏</span>
  </button>
  
  <!-- 钢琴容器 - 直接在 body 中，类似视频元素 -->
  <div id="piano-container">
    <!-- 横屏模式下的按钮 -->
    <div class="landscape-controls">
      <div class="sound-selector in-landscape">
        <button class="active" data-sound="pure">纯静</button>
        <button data-sound="soft">柔和</button>
        <button data-sound="electric">电子</button>
        <button data-sound="orchestra">管弦</button>
      </div>
      <button class="landscape-btn in-landscape">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 21H2V3h5v1.5h13V3H21v18h-5v-1.5H7.5z"/></svg>
        <span class="btn-text">横屏</span>
      </button>
    </div>
    
    <div class="piano">
      <div class="piano-key">
        <div class="piano-key__white" data-key="20" data-note="1C"><span class="key-label">C</span></div>
        <div class="piano-key__black" data-key="81" data-note="1Cs"><span class="key-label">C#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="65" data-note="1D"><span class="key-label">D</span></div>
        <div class="piano-key__black" data-key="87" data-note="1Ds"><span class="key-label">D#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="83" data-note="1E"><span class="key-label">E</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="68" data-note="1F"><span class="key-label">F</span></div>
        <div class="piano-key__black" data-key="82" data-note="1Fs"><span class="key-label">F#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="70" data-note="1G"><span class="key-label">G</span></div>
        <div class="piano-key__black" data-key="84" data-note="1Gs"><span class="key-label">G#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="71" data-note="2A"><span class="key-label">A</span></div>
        <div class="piano-key__black" data-key="89" data-note="2As"><span class="key-label">A#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="72" data-note="2B"><span class="key-label">B</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="74" data-note="2C"><span class="key-label">C</span></div>
        <div class="piano-key__black" data-key="73" data-note="2Cs"><span class="key-label">C#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="75" data-note="2D"><span class="key-label">D</span></div>
        <div class="piano-key__black" data-key="79" data-note="2Ds"><span class="key-label">D#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="76" data-note="2E"><span class="key-label">E</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="186" data-note="2F"><span class="key-label">F</span></div>
        <div class="piano-key__black" data-key="219" data-note="2Fs"><span class="key-label">F#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="222" data-note="2G"><span class="key-label">G</span></div>
        <div class="piano-key__black" data-key="221" data-note="2Gs"><span class="key-label">G#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="220" data-note="3A"><span class="key-label">A</span></div>
        <div class="piano-key__black" data-key="13" data-note="3As"><span class="key-label">A#</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="37" data-note="3B"><span class="key-label">B</span></div>
      </div>
    </div>
  </div>
  
  <main class="main">
    <div class="container">
      <div class="content">
        <h1 class="title">电子钢琴</h1>
        <h2 class="subtitle">使用 CSS 和 JavaScript 打造的钢琴 🎹</h2>
        <p class="description">触摸设备是弹奏钢琴的最佳方式，也可以使用键盘或鼠标。</p>
        <p class="description">使用键盘时，第一个键是"大小写锁定键"，按键顺序与钢琴键盘对应。</p>
      </div>
    </div>
  </main>
</body>
</html>
