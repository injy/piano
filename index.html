<!DOCTYPE html>
<html lang="en">
<head>
  <title>Piano Keyboard - To play piano using CSS and JavaScript</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#333333">
  <link rel="shortcut icon" type="image/favicon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/app.styl">
  <script type="module" src="/src/app.js"></script>
  <style>
    body {
      visibility: hidden;
    }
  </style>
</head>
<body>
  
  <!-- 音色选择器 -->
  <div class="sound-selector">
    <button class="active" data-sound="pure">纯静</button>
    <button data-sound="soft">柔和</button>
    <button data-sound="electric">电子</button>
    <button data-sound="orchestra">管弦</button>
  </div>
  
  <!-- 横屏按钮 -->
  <button class="landscape-btn" style="display: none;">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 21H2V3h5v1.5h13V3H21v18h-5v-1.5H7.5z"/></svg>
    横屏
  </button>
  
  <section class="header">
    <div class="piano">
      <div class="piano-key">
        <div class="piano-key__white" data-key="20" data-note="1C"></div>
        <div class="piano-key__black" data-key="81" data-note="1Cs"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="65" data-note="1D"></div>
        <div class="piano-key__black" data-key="87" data-note="1Ds"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="83" data-note="1E"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="68" data-note="1F"></div>
        <div class="piano-key__black" data-key="82" data-note="1Fs"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="70" data-note="1G"></div>
        <div class="piano-key__black" data-key="84" data-note="1Gs"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="71" data-note="2A"></div>
        <div class="piano-key__black" data-key="89" data-note="2As"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="72" data-note="2B"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="74" data-note="2C"></div>
        <div class="piano-key__black" data-key="73" data-note="2Cs"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="75" data-note="2D"></div>
        <div class="piano-key__black" data-key="79" data-note="2Ds"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="76" data-note="2E"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="186" data-note="2F"></div>
        <div class="piano-key__black" data-key="219" data-note="2Fs"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="222" data-note="2G"></div>
        <div class="piano-key__black" data-key="221" data-note="2Gs"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="220" data-note="3A"></div>
        <div class="piano-key__black" data-key="13" data-note="3As"></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="37" data-note="3B"></div>
      </div>
    </div>
  </section>
  <main class="main">
    <div class="container">
      <div class="content">
        <h1 class="title">Piano Keyboard</h1>
        <h2 class="subtitle">To play piano using CSS and JavaScript 😎</h2>
        <p class="description">The better way to play the piano is using a touch device. You can also use your keyboard or mouse to play.</p>
        <p class="description">Using the keyboard, the first key is "caps lock" and the sequence of keys is the same of the piano.</p>
      </div>
    </div>
  </main>
</body>
</html>
