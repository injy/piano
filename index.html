<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>电子钢琴</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#333333">
  <link rel="shortcut icon" type="image/favicon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/app.styl">
  <script type="module" src="/src/app.js"></script>
  <style>
    body {
      visibility: hidden;
    }
    /* 隐藏滚动条 */
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    /* 确保简谱层不溢出 */
    .sheet-music {
      overflow: hidden !important;
    }
    .sheet-music-track {
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <script>
    // 强制隐藏滚动条
    document.addEventListener('DOMContentLoaded', function() {
      var scrollElements = document.querySelectorAll('.sheet-music, .sheet-music-track, .sheet-music-content');
      scrollElements.forEach(function(el) {
        el.style.overflow = 'hidden';
        el.style.scrollbarWidth = 'none';
        el.style.msOverflowStyle = 'none';
      });
      // 隐藏所有元素的垂直滚动条
      document.body.style.overflowY = 'hidden';
    });
  </script>
  
  <!-- 音色选择器 -->
  <div class="sound-selector">
    <button class="active" data-sound="pure">纯静</button>
    <button data-sound="soft">柔和</button>
    <button data-sound="electric">电子</button>
    <button data-sound="orchestra">管弦</button>
  </div>
  
  <!-- 横屏按钮 -->
  <button class="landscape-btn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 21H2V3h5v1.5h13V3H21v18h-5v-1.5H7.5z"/></svg>
    <span class="btn-text">横屏</span>
  </button>
  
  <!-- 钢琴容器 - 直接在 body 中，类似视频元素 -->
  <div id="piano-container">
    <!-- 横屏模式下的按钮 -->
    <div class="landscape-controls">
      <div class="sound-selector in-landscape">
        <button class="active" data-sound="pure">纯静</button>
        <button data-sound="soft">柔和</button>
        <button data-sound="electric">电子</button>
        <button data-sound="orchestra">管弦</button>
      </div>
      <button class="landscape-btn in-landscape">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 21H2V3h5v1.5h13V3H21v18h-5v-1.5H7.5z"/></svg>
        <span class="btn-text">横屏</span>
      </button>
    </div>
    
    <!-- 简谱展示层 -->
    <div class="sheet-music">
      <div class="sheet-music-track">
        <div class="sheet-music-content"></div>
      </div>
    </div>
    
    <div class="piano">
      <!-- 低音区: CapsLock=·4, A=·5, S=·6, D=·7 -->
      <div class="piano-key">
        <div class="piano-key__white" data-key="20" data-note="1F"><span class="key-label">4<span class="dot-bottom-label">·</span></span></div>
        <div class="piano-key__black" data-key="81" data-note="1Fs"><span class="key-label">#4<span class="dot-bottom-label">·</span></span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="65" data-note="1G"><span class="key-label">5<span class="dot-bottom-label">·</span></span></div>
        <div class="piano-key__black" data-key="87" data-note="1Gs"><span class="key-label">#5<span class="dot-bottom-label">·</span></span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="83" data-note="1A"><span class="key-label">6<span class="dot-bottom-label">·</span></span></div>
        <div class="piano-key__black" data-key="69" data-note="1As"><span class="key-label">#6<span class="dot-bottom-label">·</span></span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="68" data-note="1B"><span class="key-label">7<span class="dot-bottom-label">·</span></span></div>
      </div>
      <!-- 中音区: F=1, G=2, H=3, J=4, K=5, L=6, ;=7 -->
      <div class="piano-key">
        <div class="piano-key__white" data-key="70" data-note="2C"><span class="key-label">1</span></div>
        <div class="piano-key__black" data-key="84" data-note="2Cs"><span class="key-label">#1</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="71" data-note="2D"><span class="key-label">2</span></div>
        <div class="piano-key__black" data-key="89" data-note="2Ds"><span class="key-label">#2</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="72" data-note="2E"><span class="key-label">3</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="74" data-note="2F"><span class="key-label">4</span></div>
        <div class="piano-key__black" data-key="73" data-note="2Fs"><span class="key-label">#4</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="75" data-note="2G"><span class="key-label">5</span></div>
        <div class="piano-key__black" data-key="79" data-note="2Gs"><span class="key-label">#5</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="76" data-note="2A"><span class="key-label">6</span></div>
        <div class="piano-key__black" data-key="80" data-note="2As"><span class="key-label">#6</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="186" data-note="2B"><span class="key-label">7</span></div>
      </div>
      <!-- 高音区: B=1·, N=2·, M=3· -->
      <div class="piano-key">
        <div class="piano-key__white" data-key="66" data-note="3C"><span class="key-label"><span class="dot-top-label">·</span>1</span></div>
        <div class="piano-key__black" data-key="221" data-note="3Cs"><span class="key-label"><span class="dot-top-label">·</span>#1</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="78" data-note="3D"><span class="key-label"><span class="dot-top-label">·</span>2</span></div>
        <div class="piano-key__black" data-key="220" data-note="3Ds"><span class="key-label"><span class="dot-top-label">·</span>#2</span></div>
      </div>
      <div class="piano-key">
        <div class="piano-key__white" data-key="77" data-note="3E"><span class="key-label"><span class="dot-top-label">·</span>3</span></div>
      </div>
    </div>
  </div>
  
  <main class="main">
    <div class="container">
      <div class="content">
        <h1 class="title">电子钢琴</h1>
        <h2 class="subtitle">使用 CSS 和 JavaScript 打造的钢琴 🎹</h2>
        <p class="description">触摸设备是弹奏钢琴的最佳方式，也可以使用键盘或鼠标。</p>
        <p class="description">使用键盘时，按键顺序与钢琴键盘从左到右对应。</p>
      </div>
    </div>
  </main>
</body>
</html>
